  .btn svg { width: 26px; height: 26px; fill: #fff; flex-shrink: 0; }
  .btn .txt { flex: 1; text-align: left; }
  .btn .t1 { font-size: 16px; font-weight: 600; }

<body>
<div class="card">

<script>
(async function () {
  try {
    const r = await fetch('latest.json?_=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    document.getElementById('verBadge').textContent = 'v' + d.version;
    document.getElementById('timeBadge').textContent = '更新于 ' + d.updated_at;
    const w = d.files && d.files.windows, m = d.files && d.files.mac;
    if (w) {
      document.getElementById('btnWin').href = w.name;
      document.getElementById('winMeta').textContent =
        'Setup 安装程序 · ' + (w.size_mb ? w.size_mb + ' MB' : '双击安装即用');
    }
    if (m) {
      document.getElementById('btnMac').href = m.name;
      document.getElementById('macMeta').textContent =
        '解压后拖入应用程序' + (m.size_mb ? ' · ' + m.size_mb + ' MB' : '');
    }
  } catch (e) {
    // 拉取失败也要兜底：版本徽章给提示，按钮保持默认 href（latest 固定链接）仍可下载
    document.getElementById('verBadge').textContent = '获取版本信息失败';
    document.getElementById('timeBadge').textContent = '';
  }
})();
</script>
