# -*- mode: yaml ; coding: utf-8 -*-
# MusicFinder 跨平台打包 CI
# 作用：推送代码到 GitHub 后，自动在云端 Windows / macOS runner 上
#       分别产出 MusicFinder.exe 与 MusicFinder-mac.zip，无需本机有对应系统。
#
# 用法：
#   1. 把整个项目（app.py / templates / static / musicfinder_*.spec / 本文件）
#      推送到 GitHub 仓库。
#   2. 在仓库页面 Actions → "Build MusicFinder" → Run workflow（或任意 push 自动触发）。
#   3. 运行结束后，到 Artifacts 下载 MusicFinder-windows / MusicFinder-macos。
#
# 说明：
#   - Windows runner 默认 x64，产出的 .exe 是标准 x64 版，分发给所有 Windows 用户可用。
#   - macOS 步骤复刻了本地 build_mac.sh 的「清理缓存 + 覆盖最新前端 + 校验」逻辑，
#     避免 PyInstaller 把陈旧 templates 打进 bundle（此前踩过的坑）。

name: Build MusicFinder

on:
  push:
    branches: [main, master, publish]
    tags: ['v*']          # 推送 v* tag 时触发：自动打包并发布 GitHub Release
  workflow_dispatch:

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # playwright Python 包打入 bundle。Windows 的 Chromium 浏览器二进制在下一步
          # 下载并烤进安装包（团队用户零下载）；macOS 不在 CI 下载，改由运行端按需下载规避重签失败
          pip install pyinstaller flask openpyxl requests pypinyin pycryptodome playwright patchright

      - name: 下载 Chromium 并烤进 Windows 安装包（团队用户零下载）
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw_browsers
        run: |
          python -m playwright install chromium
          # patchright（抖音取证反爬分支）：浏览器同目录烤入
          python -m patchright install chromium

      - name: 注入密钥（仅打包时，源码不含密钥）
        shell: bash
        env:
          CB_URL: ${{ secrets.CLOUDBASE_URL }}
          CB_TOKEN: ${{ secrets.CLOUDBASE_TOKEN }}
          DC_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          url = os.environ.get('CB_URL','') or ''
          tok = os.environ.get('CB_TOKEN','') or ''
          dc  = os.environ.get('DC_TOKEN','') or ''
          with open('config/_build_secrets.py','w',encoding='utf-8') as f:
              f.write('# AUTO-GENERATED at build time, never committed\n')
              f.write('DISCOGS_TOKEN = ' + repr(dc) + '\n')
              f.write('CLOUDBASE_URL = ' + repr(url) + '\n')
              f.write('CLOUDBASE_TOKEN = ' + repr(tok) + '\n')
          print('build secrets: cloudbase_set=%s discogs_set=%s' % (bool(tok), bool(dc)))
          PY

      - name: Build with PyInstaller（one-dir：产出 dist/MusicFinder/ 目录）
        # v4.29 起 Windows 由 one-file 改 one-dir：不再每次启动把几百 MB（含 Chromium）
        # 解压到 %TEMP%\_MEI 随机临时目录被 Defender 实时扫描；配合安装器预置的
        # Defender 排除，用户装完即用、无需任何手动配置即可获得提速效果。
        run: python -m PyInstaller musicfinder_win.spec --noconfirm

      - name: Read APP_VERSION from app.py
        id: v
        shell: bash
        run: echo "v=$(grep -E "^APP_VERSION[[:space:]]*=" app.py | head -1 | sed -E "s/.*['\"]([^'\"]+)['\"].*/\1/")" >> "$GITHUB_OUTPUT"

      - name: 编译 Windows 安装器（安装时自动把安装目录加入 Defender 排除）
        # 安装器是分发给团队的主产物：双击安装 → 仅弹一次 UAC → 自动加 Defender 排除，
        # 之后永久提速、无需用户执行任何命令。NSIS 缺失时现场安装。
        # 诊断刻意做全：「makensis 找不到」和「nsi 编译报错」表现都是整个步骤变红，
        # 没有这些输出就只能靠猜，排障要来回跑 CI。
        shell: pwsh
        run: |
          Write-Host "=== [1/4] 确认 one-dir 产物存在 ==="
          if (-not (Test-Path "dist\MusicFinder\MusicFinder.exe")) {
            Write-Host "::error::dist\MusicFinder\MusicFinder.exe 不存在，PyInstaller 产物异常"
            Get-ChildItem dist -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
            exit 1
          }
          Write-Host "dist\MusicFinder 内容（前 15 项）:"
          Get-ChildItem "dist\MusicFinder" | Select-Object -ExpandProperty Name | Select-Object -First 15

          Write-Host "=== [2/4] 定位 makensis ==="
          $candidates = @(
            "C:\Program Files (x86)\NSIS\makensis.exe",
            "C:\Program Files\NSIS\makensis.exe",
            "C:\ProgramData\chocolatey\lib\nsis\tools\makensis.exe"
          )
          $makensis = $null
          foreach ($c in $candidates) {
            if (Test-Path $c) { Write-Host "  命中候选路径: $c"; $makensis = $c; break }
          }
          if (-not $makensis) {
            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd) { Write-Host "  命中 PATH: $($cmd.Source)"; $makensis = $cmd.Source }
          }
          if (-not $makensis) {
            Write-Host "  未找到 NSIS，执行 choco install nsis ..."
            choco install nsis -y --no-progress
            foreach ($c in $candidates) { if (Test-Path $c) { $makensis = $c; break } }
            if (-not $makensis) {
              $cmd = Get-Command makensis -ErrorAction SilentlyContinue
              if ($cmd) { $makensis = $cmd.Source }
            }
          }
          # 最后兜底：候选路径都没命中时递归搜索（NSIS 的实际安装位置可能不在上述路径）
          if (-not $makensis) {
            Write-Host "  候选路径未命中，递归搜索 makensis.exe ..."
            $found = Get-ChildItem -Path "C:\Program Files", "C:\Program Files (x86)", "C:\ProgramData" `
              -Filter "makensis.exe" -Recurse -Depth 4 -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $makensis = $found.FullName; Write-Host "  递归搜索命中: $makensis" }
          }
          if (-not $makensis) {
            Write-Host "::error::makensis 不可用：无法生成 Windows 安装器"
            Write-Host "诊断 - 各候选路径存在性:"
            foreach ($c in $candidates) { Write-Host "  $c => $(Test-Path $c)" }
            Write-Host "诊断 - 'C:\Program Files (x86)' 顶层目录:"
            Get-ChildItem "C:\Program Files (x86)" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
            exit 1
          }
          Write-Host "  使用 makensis: $makensis"
          & $makensis /VERSION

          Write-Host "=== [3/4] 编译 installer_windows.nsi ==="
          & $makensis /V2 /DAPP_VERSION="${{ steps.v.outputs.v }}" installer_windows.nsi
          $rc = $LASTEXITCODE
          Write-Host "makensis 退出码 = $rc"

          Write-Host "=== [4/4] 校验安装器产物 ==="
          $out = "dist\MusicFinder-v${{ steps.v.outputs.v }}-Windows-Setup.exe"
          if (($rc -ne 0) -or -not (Test-Path $out)) {
            Write-Host "::error::安装器编译失败或未产出 (exit=$rc, 期望产物=$out)"
            exit 1
          }
          Get-Item $out | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      # 免安装压缩包：安装器万一出问题时团队仍有可用产物（需自行加 Defender 排除）
      - name: 额外产出免安装压缩包（兜底，失败不阻塞）
        shell: pwsh
        continue-on-error: true
        run: |
          7z a -tzip "dist\MusicFinder-v${{ steps.v.outputs.v }}-Windows-Portable.zip" ".\dist\MusicFinder\*"

      - name: Upload Windows artifact（安装器，主产物）
        uses: actions/upload-artifact@v4
        with:
          name: MF-${{ steps.v.outputs.v }}-Windows
          path: dist/MusicFinder-v${{ steps.v.outputs.v }}-Windows-Setup.exe
          # 公开仓库 Actions 存储无配额限制，保留 90 天给用户充足下载窗口
          retention-days: 90

      - name: Upload Windows artifact（免安装版，兜底）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MF-${{ steps.v.outputs.v }}-Windows-Portable
          path: dist/MusicFinder-v${{ steps.v.outputs.v }}-Windows-Portable.zip
          retention-days: 90

  macos:
    name: macOS (.app / .zip)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # playwright Python 包打入 bundle；Chromium 浏览器二进制不在 CI 下载（避免 macOS ad-hoc 重签失败 + 体积膨胀），
          # 由运行端首次一键登录时按需下载到用户级缓存
          pip install pyinstaller flask openpyxl requests pypinyin pycryptodome playwright

      - name: 注入密钥（仅打包时，源码不含密钥）
        shell: bash
        env:
          CB_URL: ${{ secrets.CLOUDBASE_URL }}
          CB_TOKEN: ${{ secrets.CLOUDBASE_TOKEN }}
          DC_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          url = os.environ.get('CB_URL','') or ''
          tok = os.environ.get('CB_TOKEN','') or ''
          dc  = os.environ.get('DC_TOKEN','') or ''
          with open('config/_build_secrets.py','w',encoding='utf-8') as f:
              f.write('# AUTO-GENERATED at build time, never committed\n')
              f.write('DISCOGS_TOKEN = ' + repr(dc) + '\n')
              f.write('CLOUDBASE_URL = ' + repr(url) + '\n')
              f.write('CLOUDBASE_TOKEN = ' + repr(tok) + '\n')
          print('build secrets: cloudbase_set=%s discogs_set=%s' % (bool(tok), bool(dc)))
          PY

      - name: Build with PyInstaller (fresh, avoid stale bundle)
        run: |
          rm -rf dist build
          python -m PyInstaller musicfinder_mac.spec --noconfirm
          # 双保险：显式覆盖最新前端，避免 PyInstaller 缓存陈旧 templates
          # （用整目录拷贝，避免漏掉 evidence.html / monitor.html / playlist.html 等新页面）
          cp -rf templates/. dist/MusicFinder.app/Contents/Resources/templates/
          cp -rf static/. dist/MusicFinder.app/Contents/Resources/static/
          cd dist && zip -r -q MusicFinder-mac.zip MusicFinder.app

      - name: Read APP_VERSION from app.py
        id: v
        shell: bash
        run: echo "v=$(grep -E "^APP_VERSION[[:space:]]*=" app.py | head -1 | sed -E "s/.*['\"]([^'\"]+)['\"].*/\1/")" >> "$GITHUB_OUTPUT"

      - name: 重命名为带版本号的安装包（团队下载到本地一看就知版本）
        run: mv "dist/MusicFinder-mac.zip" "dist/MusicFinder-v${{ steps.v.outputs.v }}-Mac.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: MF-${{ steps.v.outputs.v }}-Mac
          path: dist/MusicFinder-v${{ steps.v.outputs.v }}-Mac.zip
          # 公开仓库 Actions 存储无配额限制，保留 90 天给用户充足下载窗口
          retention-days: 90

  release:
    name: 发布 GitHub Release（推 main 或打 v* tag 均触发）
    needs: [windows, macos]
    runs-on: ubuntu-latest
    # 推 main（维护者经连接器推送）或打 v* tag 都会自动打包并发布 Release。
    # GITHUB_TOKEN 创建的 tag 不会再次触发本工作流，故无死循环。
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read APP_VERSION from app.py
        id: v
        shell: bash
        run: echo "v=$(grep -E "^APP_VERSION[[:space:]]*=" app.py | head -1 | sed -E "s/.*['\"]([^'\"]+)['\"].*/\1/")" >> "$GITHUB_OUTPUT"

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: MF-${{ steps.v.outputs.v }}-Windows
          path: release

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: MF-${{ steps.v.outputs.v }}-Mac
          path: release

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # tag 统一用 v + APP_VERSION（打 tag 推送时二者一致，不会冲突）
          tag_name: v${{ steps.v.outputs.v }}
          name: MusicFinder v${{ steps.v.outputs.v }}
          body: |
            ## MusicFinder v${{ steps.v.outputs.v }} 自动构建

            - **MusicFinder-v${{ steps.v.outputs.v }}-Windows-Setup.exe**：Windows 安装程序（双击安装，自动配置 Defender 排除，装完即用、无需任何手动命令）
            - **MusicFinder-v${{ steps.v.outputs.v }}-Mac.zip**：macOS 安装包（解压后拖入应用）

            > Windows 用户请下载 **Setup 安装程序**：安装时会把程序目录加入 Windows Defender
            > 排除列表 —— 这是 Windows 端搜索提速的关键一步，无需再手动执行任何 PowerShell 命令。
            >
            > 搜索歌曲需先在「Cookie 设置」页用一键浏览器登录自己的音乐账号。
          files: |
            release/MusicFinder-v${{ steps.v.outputs.v }}-Windows-Setup.exe
            release/MusicFinder-v${{ steps.v.outputs.v }}-Mac.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
