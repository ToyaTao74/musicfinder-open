# -*- mode: yaml ; coding: utf-8 -*-
# MusicFinder 跨平台打包 CI
# 作用：推送代码到 GitHub 后，自动在云端 Windows / macOS runner 上
#       分别产出 MusicFinder.exe 与 MusicFinder-mac.zip，无需本机有对应系统。
#
# 用法：
#   1. 把整个项目（app.py / templates / static / musicfinder_*.spec / 本文件）
#      推送到 GitHub 仓库。
#   2. 在仓库页面 Actions → "Build MusicFinder" → Run workflow（或任意 push 自动触发）。
#   3. 运行结束后，到 Artifacts 下载 MusicFinder-windows / MusicFinder-macos。
#
# 说明：
#   - Windows runner 默认 x64，产出的 .exe 是标准 x64 版，分发给所有 Windows 用户可用。
#   - macOS 步骤复刻了本地 build_mac.sh 的「清理缓存 + 覆盖最新前端 + 校验」逻辑，
#     避免 PyInstaller 把陈旧 templates 打进 bundle（此前踩过的坑）。

name: Build MusicFinder

on:
  push:
    branches: [main, master, publish]
    tags: ['v*']          # 推送 v* tag 时触发：自动打包并发布 GitHub Release
  workflow_dispatch:

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # playwright Python 包打入 bundle。Windows 的 Chromium 浏览器二进制在下一步
          # 下载并烤进安装包（团队用户零下载）；macOS 不在 CI 下载，改由运行端按需下载规避重签失败
          pip install pyinstaller flask openpyxl requests pypinyin pycryptodome playwright

      - name: 下载 Chromium 并烤进 Windows 安装包（团队用户零下载）
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw_browsers
        run: python -m playwright install chromium

      - name: 注入密钥（仅打包时，源码不含密钥）
        shell: bash
        env:
          CB_URL: ${{ secrets.CLOUDBASE_URL }}
          CB_TOKEN: ${{ secrets.CLOUDBASE_TOKEN }}
          DC_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          url = os.environ.get('CB_URL','') or ''
          tok = os.environ.get('CB_TOKEN','') or ''
          dc  = os.environ.get('DC_TOKEN','') or ''
          with open('config/_build_secrets.py','w',encoding='utf-8') as f:
              f.write('# AUTO-GENERATED at build time, never committed\n')
              f.write('DISCOGS_TOKEN = ' + repr(dc) + '\n')
              f.write('CLOUDBASE_URL = ' + repr(url) + '\n')
              f.write('CLOUDBASE_TOKEN = ' + repr(tok) + '\n')
          print('build secrets: cloudbase_set=%s discogs_set=%s' % (bool(tok), bool(dc)))
          PY

      - name: Build with PyInstaller
        run: python -m PyInstaller musicfinder_win.spec --noconfirm

      - name: Read APP_VERSION from app.py
        id: v
        shell: bash
        run: echo "v=$(grep -E "^APP_VERSION[[:space:]]*=" app.py | head -1 | sed -E "s/.*['\"]([^'\"]+)['\"].*/\1/")" >> "$GITHUB_OUTPUT"

      - name: 重命名为带版本号的安装包（团队下载到本地一看就知版本）
        shell: bash
        run: mv "dist/MusicFinder.exe" "dist/MusicFinder-v${{ steps.v.outputs.v }}-Windows.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: MF-${{ steps.v.outputs.v }}-Windows
          path: dist/MusicFinder-v${{ steps.v.outputs.v }}-Windows.exe
          # 公开仓库 Actions 存储无配额限制，保留 90 天给用户充足下载窗口
          retention-days: 90

  macos:
    name: macOS (.app / .zip)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # playwright Python 包打入 bundle；Chromium 浏览器二进制不在 CI 下载（避免 macOS ad-hoc 重签失败 + 体积膨胀），
          # 由运行端首次一键登录时按需下载到用户级缓存
          pip install pyinstaller flask openpyxl requests pypinyin pycryptodome playwright

      - name: 注入密钥（仅打包时，源码不含密钥）
        shell: bash
        env:
          CB_URL: ${{ secrets.CLOUDBASE_URL }}
          CB_TOKEN: ${{ secrets.CLOUDBASE_TOKEN }}
          DC_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
        run: |
          python - <<'PY'
          import os
          url = os.environ.get('CB_URL','') or ''
          tok = os.environ.get('CB_TOKEN','') or ''
          dc  = os.environ.get('DC_TOKEN','') or ''
          with open('config/_build_secrets.py','w',encoding='utf-8') as f:
              f.write('# AUTO-GENERATED at build time, never committed\n')
              f.write('DISCOGS_TOKEN = ' + repr(dc) + '\n')
              f.write('CLOUDBASE_URL = ' + repr(url) + '\n')
              f.write('CLOUDBASE_TOKEN = ' + repr(tok) + '\n')
          print('build secrets: cloudbase_set=%s discogs_set=%s' % (bool(tok), bool(dc)))
          PY

      - name: Build with PyInstaller (fresh, avoid stale bundle)
        run: |
          rm -rf dist build
          python -m PyInstaller musicfinder_mac.spec --noconfirm
          # 双保险：显式覆盖最新前端，避免 PyInstaller 缓存陈旧 templates
          # （用整目录拷贝，避免漏掉 evidence.html / monitor.html / playlist.html 等新页面）
          cp -rf templates/. dist/MusicFinder.app/Contents/Resources/templates/
          cp -rf static/. dist/MusicFinder.app/Contents/Resources/static/
          cd dist && zip -r -q MusicFinder-mac.zip MusicFinder.app

      - name: Read APP_VERSION from app.py
        id: v
        shell: bash
        run: echo "v=$(grep -E "^APP_VERSION[[:space:]]*=" app.py | head -1 | sed -E "s/.*['\"]([^'\"]+)['\"].*/\1/")" >> "$GITHUB_OUTPUT"

      - name: 重命名为带版本号的安装包（团队下载到本地一看就知版本）
        run: mv "dist/MusicFinder-mac.zip" "dist/MusicFinder-v${{ steps.v.outputs.v }}-Mac.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: MF-${{ steps.v.outputs.v }}-Mac
          path: dist/MusicFinder-v${{ steps.v.outputs.v }}-Mac.zip
          # 公开仓库 Actions 存储无配额限制，保留 90 天给用户充足下载窗口
          retention-days: 90

  release:
    name: 发布 GitHub Release（推 main 或打 v* tag 均触发）
    needs: [windows, macos]
    runs-on: ubuntu-latest
    # 推 main（维护者经连接器推送）或打 v* tag 都会自动打包并发布 Release。
    # GITHUB_TOKEN 创建的 tag 不会再次触发本工作流，故无死循环。
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read APP_VERSION from app.py
        id: v
        shell: bash
        run: echo "v=$(grep -E "^APP_VERSION[[:space:]]*=" app.py | head -1 | sed -E "s/.*['\"]([^'\"]+)['\"].*/\1/")" >> "$GITHUB_OUTPUT"

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: MF-${{ steps.v.outputs.v }}-Windows
          path: release

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: MF-${{ steps.v.outputs.v }}-Mac
          path: release

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # tag 统一用 v + APP_VERSION（打 tag 推送时二者一致，不会冲突）
          tag_name: v${{ steps.v.outputs.v }}
          name: MusicFinder v${{ steps.v.outputs.v }}
          body: |
            ## MusicFinder v${{ steps.v.outputs.v }} 自动构建

            - **MusicFinder-v${{ steps.v.outputs.v }}-Windows.exe**：Windows 安装包（双击即用，CloudBase 同步 + Discogs 厂牌查询已内嵌）
            - **MusicFinder-v${{ steps.v.outputs.v }}-Mac.zip**：macOS 安装包（解压后拖入应用）

            > 搜索歌曲需先在「Cookie 设置」页用一键浏览器登录自己的音乐账号。
          files: |
            release/MusicFinder-v${{ steps.v.outputs.v }}-Windows.exe
            release/MusicFinder-v${{ steps.v.outputs.v }}-Mac.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-cos:
    name: 同步安装包到腾讯云 COS（国内直连，免 GitHub 下载）
    # 依赖 release 完成；仅在配置了 COS 密钥时运行（未配置则自动跳过，不阻塞发版）
    needs: [release]
    runs-on: ubuntu-latest
    if: (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') && secrets.COS_SECRET_ID != ''
    steps:
      - uses: actions/checkout@v4

      - name: Read APP_VERSION
        id: v
        run: echo "v=$(grep -E "^APP_VERSION[[:space:]]*=" app.py | head -1 | sed -E "s/.*['\"]([^'\"]+)['\"].*/\1/")" >> "$GITHUB_OUTPUT"

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: MF-${{ steps.v.outputs.v }}-Windows
          path: out

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: MF-${{ steps.v.outputs.v }}-Mac
          path: out

      - name: 安装 coscli 并生成配置
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: |
          curl -L -o coscli "https://github.com/Tencent/coscli/releases/latest/download/coscli-linux-amd64"
          chmod +x coscli
          # 用 printf 生成配置，避免 heredoc 在 YAML 缩进下无法终止的问题
          printf 'cos:\n  base:\n    secretid: %s\n    secretkey: %s\n    sessiontoken: ""\n  buckets:\n  - name: %s\n    region: %s\n    alias: mf\n' \
            "$COS_SECRET_ID" "$COS_SECRET_KEY" "$COS_BUCKET" "$COS_REGION" > "$HOME/.cos.yaml"
          ./coscli --version || echo "coscli 下载/执行异常"

      - name: 上传到 COS（带版本号 + latest 固定直链，均公开可读）
        env:
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: |
          PREFIX="musicfinder"
          BASE="https://$COS_BUCKET.cos.$COS_REGION.myqcloud.com/$PREFIX"
          for f in out/*; do
            bn=$(basename "$f")
            # 带版本号的对象（归档用）
            ./coscli cp "$f" "cos://mf/$PREFIX/$bn" --acl public-read
            # 同时生成 latest 固定直链（团队永远点同一个链接拿最新版）
            latest=$(echo "$bn" | sed -E "s/v[0-9]+\.[0-9]+\.[0-9]+/latest/")
            ./coscli cp "$f" "cos://mf/$PREFIX/$latest" --acl public-read
            echo "- 版本包: $BASE/$bn"
            echo "- 最新包: $BASE/$latest"
          done
          {
            echo "## 📦 国内直连下载地址（腾讯云 COS）"
            echo ""
            echo "- **Windows（最新）**: $BASE/MusicFinder-latest-Windows.exe"
            echo "- **macOS（最新）**: $BASE/MusicFinder-latest-Mac.zip"
            echo ""
            echo "> 以上为固定直链，每次发版自动更新内容；无需 VPN、无需访问 GitHub。"
          } >> "$GITHUB_STEP_SUMMARY"
